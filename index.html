<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>demotopassAR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    a-scene {
      position: fixed !important;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
    }

    canvas {
      background: transparent !important;
    }
  </style>
</head>

<body>

  <a-scene
    mindar-image="imageTargetSrc: targets.mind;"
    embedded
    color-space="sRGB"
    renderer="colorManagement: true; alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video
        id="demoVideo"
        src="https://pub-ea83f2fd21904eceaa0a3917e464aaf5.r2.dev/c1_MP3_320.mov"
        crossorigin="anonymous"
        preload="auto"
        loop
        playsinline
        webkit-playsinline>
      </video>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- 写真を認識すると透過動画を表示 -->
    <a-entity mindar-image-target="targetIndex: 0">

      <a-video
        src="#demoVideo"
        width="1"
        height="1.7778"
        position="0 0 0"
        rotation="0 0 0">
      </a-video>

    </a-entity>

  </a-scene>

  <script>
    const video = document.querySelector("#demoVideo");
    const target = document.querySelector("[mindar-image-target]");

    let userAllowedAudio = false;
    let targetVisible = false;

    // 動画の読み込みエラーを確認
    video.addEventListener("error", () => {
      console.error("動画読み込みエラー:", video.error);
    });

    // 最初の画面タップで音声付き再生を許可
    document.addEventListener("click", async () => {
      userAllowedAudio = true;

      if (targetVisible) {
        try {
          await video.play();
        } catch (error) {
          console.error("動画再生エラー:", error);
        }
      }
    }, { once: true });

    // 写真を認識したら動画を再生
    target.addEventListener("targetFound", async () => {
      targetVisible = true;
      video.currentTime = 0;

      if (userAllowedAudio) {
        try {
          await video.play();
        } catch (error) {
          console.error("動画再生エラー:", error);
        }
      }
    });

    // 写真を見失ったら動画を停止
    target.addEventListener("targetLost", () => {
      targetVisible = false;
      video.pause();
    });
  </script>

</body>
</html>
